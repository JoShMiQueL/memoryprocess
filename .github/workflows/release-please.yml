name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Only run on main — on feature branches (where this file is new) GitHub
    # evaluates the workflow on push even though branches:[main] excludes it,
    # producing a spurious 'workflow file issue' failure. Guard explicitly.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
        token: ${{ secrets.GITHUB_TOKEN }}
