name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Build toolchain (tsdown/tsc/node-gyp) needs a modern Node; the produced
      # .node is N-API and stays binary-compatible across runtime versions.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun fmt --check

      - name: Typecheck
        run: bun run typecheck

      - name: Bun check
        run: bun run check

      - name: Build native addon
        run: bun run build

      - name: Build test victim
        run: node scripts/build-victim.mjs

      - name: Build test DLL
        run: node scripts/build-testdll.mjs

      - name: Test (bun)
        run: bun test

  # The addon must LOAD on every supported Node version. A .node linked against
  # Node 24's node.lib can crash on Node 20, so each matrix leg rebuilds the
  # native addon against its own Node headers (node-gyp only — the JS bundle
  # toolchain needs modern Node and isn't exercised by the compat smoke).
  compat:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addon (node ${{ matrix.node }})
        run: node scripts/build-native.mjs

      - name: Stage .node for compat test
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/memoryprocess.node dist/memoryprocess.node -Force

      - name: Compat smoke (node ${{ matrix.node }})
        run: node --test tests/compat/smoke.test.mjs
