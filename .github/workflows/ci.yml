name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Read-only by default; publish/release workflows grant their own scopes.
permissions:
  contents: read

# Per-PR concurrency so a push to main is never cancelled by a PR sync, and a
# draft PR's run is superseded by its own later pushes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    # Skip on draft PRs — saves a full native-build + 166-test run per WIP push.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # bun version pinned in package.json "packageManager" — single source.
          bun-version-file: package.json
      # Build toolchain (tsdown/tsc/node-gyp) needs a modern Node; the produced
      # .node is N-API and stays binary-compatible across runtime versions.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No bun cache on Windows: opencode measured archive-extraction is slower
      # than bun downloading packages itself.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun fmt --check

      - name: Typecheck
        run: bun run typecheck

      - name: Bun check
        run: bun run check

      - name: Build native addon
        run: bun run build

      - name: Build test victim
        run: node scripts/build-victim.mjs

      - name: Build test DLL
        run: node scripts/build-testdll.mjs

      - name: Test (bun)
        run: bun test

  # The addon must LOAD on every supported Node version. A .node linked against
  # one version's node.lib can crash on another, so each matrix leg rebuilds the
  # native addon against its own headers (node-gyp only — the JS bundle toolchain
  # needs modern Node and isn't exercised by the compat smoke).
  #   22 = Maintenance LTS · 24 = Active LTS · 25 = Current · 26 = newest LTS
  #   Node 26 is clang+thin-LTO built — the binding.gyp workaround is exercised here.
  compat:
    needs: verify
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '25', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addon (node ${{ matrix.node }})
        run: node scripts/build-native.mjs

      - name: Stage .node for compat test
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/memoryprocess.node dist/memoryprocess.node -Force

      - name: Compat smoke (node ${{ matrix.node }})
        run: node --test tests/compat/smoke.test.mjs

  # The thing a real user installs is the TARBALL, not the repo. Pack it, install
  # into a clean dir, and load it — catches missing files / broken dist/ / bad
  # "files" allowlist that the in-repo tests can't see.
  packaged:
    needs: verify
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native addon
        run: bun run build

      - name: Pack tarball
        run: |
          $tgz = npm pack --pack-destination "$env:RUNNER_TEMP" | Select-Object -Last 1
          echo "TGZ=$env:RUNNER_TEMP\$tgz" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install tarball in clean dir + smoke (node)
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\consumer" | Out-Null
          Set-Location "$env:RUNNER_TEMP\consumer"
          npm init -y | Out-Null
          npm install "$env:TGZ" | Out-Null
          node --input-type=module -e "import { Process } from 'memoryprocess'; const p = Process.list(); if (!p.length) throw new Error('list empty'); console.log('OK', p.length, 'processes')"

      # The package must load as a Bun consumer too — the .node is N-API and
      # loads the same way, but this is the real-user check on the tarball.
      - name: Smoke as Bun consumer
        run: |
          Set-Location "$env:RUNNER_TEMP\consumer"
          bun -e "import { Process } from 'memoryprocess'; const p = Process.list(); if (!p.length) throw new Error('list empty'); console.log('Bun OK', p.length, 'processes')"
